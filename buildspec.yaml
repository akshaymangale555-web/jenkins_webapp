version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing souce NPM dependencies...
      - npm install
  build:
    commands:
      - echo Build started on 'date'
      - echo Building the Node.js application...
      - npm run build
  post_build:
    commands:
      - echo build completed on 'date'
      - mkdir deploy
      - cp -r dist deploy/dist
      - mv appspec.yaml appspec.yaml
      - cp appspec.yml deploy/
      - cp -r script deploy/
      - chmod +x deploy/scripts/restartNginx.sh
      - chmod +x deploy/scripts/appStop.sh

artifacts:
  files:
    - '**/*'
  base-directory: deploy
  name: frontend-build

